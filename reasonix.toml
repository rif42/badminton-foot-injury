0.03,-0.18), right_heel=(0.32,0.03,0.12), left_foot_index=(-0.22,0.03,0.17), right_foot_index=(0.45,0.03,0.47)),\n \"risky_stiff_jump_landing\": dict(left_hip=(-0.22,1.42,0.00), right_hip=(0.22,1.42,0.00), left_knee=(-0.22,0.82,0.02), right_knee=(0.22,0.82,0.02), left_ankle=(-0.22,0.10,0.00), right_ankle=(0.22,0.10,0.00), left_heel=(-0.24,0.03,-0.12), right_heel=(0.20,0.03,-0.12), left_foot_index=(-0.24,0.03,0.22), right_foot_index=(0.20,0.03,0.22)),\n \"risky_asymmetric_landing\": dict(left_hip=(-0.25,1.18,-0.03), right_hip=(0.25,1.34,0.02), left_knee=(-0.28,0.47,0.12), right_knee=(0.22,0.86,0.02), left_ankle=(-0.30,0.10,0.15), right_ankle=(0.22,0.16,0.00), left_heel=(-0.35,0.03,0.02), right_heel=(0.20,0.08,-0.12), left_foot_index=(-0.30,0.03,0.42), right_foot_index=(0.21,0.08,0.22)),\n}\nROLL = {\n \"ankle_roll_caution\": dict(left_hip=(-0.22,1.35,0.00), right_hip=(0.22,1.35,0.00), left_knee=(-0.22,0.76,0.02), right_knee=(0.22,0.76,0.02), left_ankle=(-0.22,0.10,0.00), right_ankle=(0.22,0.10,0.00), left_heel=(-0.24,0.03,-0.12), right_heel=(0.24,0.03,-0.12), left_foot_index=(-0.24,0.03,0.22), right_foot_index=(0.24,0.03,0.22)),\n \"ankle_roll_critical\": dict(left_hip=(-0.22,1.35,0.00), right_hip=(0.22,1.35,0.00), left_knee=(-0.22,0.76,0.02), right_knee=(0.22,0.76,0.02), left_ankle=(-0.22,0.10,0.00), right_ankle=(0.22,0.10,0.00), left_heel=(-0.24,0.03,-0.12), right_heel=(0.27,0.05,-0.12), left_foot_index=(-0.24,0.03,0.22), right_foot_index=(0.27,0.05,0.22)),\n}\nCAT = {\n \"catastrophic_knee_collapse_right_lunge\": dict(left_hip=(-0.18,1.25,-0.20), right_hip=(0.28,1.16,0.04), left_knee=(-0.25,0.72,-0.10), right_knee=(-0.38,0.42,0.58), left_ankle=(-0.28,0.10,-0.20), right_ankle=(0.38,0.10,0.98), left_heel=(-0.31,0.03,-0.34), right_heel=(0.34,0.03,0.80), left_foot_index=(-0.26,0.03,0.05), right_foot_index=(0.55,0.03,1.28)),\n \"catastrophic_crossed_feet_landing\": dict(left_hip=(-0.22,1.30,0.00), right_hip=(0.22,1.22,0.00), left_knee=(0.10,0.66,0.08), right_knee=(-0.10,0.60,0.08), left_ankle=(0.28,0.10,0.10), right_ankle=(-0.28,0.10,0.10), left_heel=(0.18,0.03,-0.08), right_heel=(-0.18,0.03,-0.08), left_foot_index=(0.45,0.03,0.28), right_foot_index=(-0.45,0.03,0.28)),\n \"catastrophic_extreme_overreach_lunge\": dict(left_hip=(-0.15,1.42,-0.72), right_hip=(0.30,1.34,-0.60), left_knee=(-0.20,0.86,-0.24), right_knee=(0.46,0.44,0.72), left_ankle=(-0.28,0.10,-0.34), right_ankle=(0.42,0.10,1.55), left_heel=(-0.34,0.03,-0.52), right_heel=(0.38,0.03,1.36), left_foot_index=(-0.23,0.03,-0.12), right_foot_index=(0.62,0.03,1.88)),\n \"catastrophic_ankle_roll_proxy_right\": dict(left_hip=(-0.20,1.25,-0.10), right_hip=(0.25,1.18,0.02), left_knee=(-0.25,0.72,-0.04), right_knee=(0.18,0.52,0.45), left_ankle=(-0.28,0.10,-0.10), right_ankle=(0.35,0.10,0.86), left_heel=(-0.31,0.03,-0.24), right_heel=(0.63,0.02,0.70), left_foot_index=(-0.24,0.03,0.12), right_foot_index=(0.02,0.03,1.15)),\n \"catastrophic_one_leg_drop_asymmetry\": dict(left_hip=(-0.30,0.98,0.00), right_hip=(0.25,1.42,0.02), left_knee=(-0.38,0.38,0.18), right_knee=(0.18,0.90,0.02), left_ankle=(-0.42,0.10,0.32), right_ankle=(0.22,0.24,0.00), left_heel=(-0.46,0.03,0.16), right_heel=(0.20,0.17,-0.12), left_foot_index=(-0.40,0.03,0.62), right_foot_index=(0.22,0.17,0.22)),\n}\n\nCTX = {\n \"good_split_step_soft\": (\"jump_landing\",\"right\",0.18,0.18,0.05,0.05),\n \"good_right_lunge\": (\"lunge\",\"right\",0.25,0.25,0.10,0.10),\n \"good_left_lunge\": (\"lunge\",\"left\",0.25,0.25,0.10,0.10),\n \"good_jump_landing_soft\": (\"jump_landing\",\"right\",0.22,0.22,0.08,0.08),\n \"good_direction_change\": (\"direction_change\",\"right\",0.30,0.30,0.12,0.12),\n \"risky_right_knee_valgus_lunge\": (\"lunge\",\"right\",0.45,0.45,0.45,0.20),\n \"risky_left_knee_valgus_lunge\": (\"lunge\",\"left\",0.45,0.45,0.45,0.20),\n \"risky_toe_in_landing\": (\"jump_landing\",\"right\",0.55,0.55,0.35,0.20),\n \"risky_overreach_lunge\": (\"lunge\",\"right\",0.50,0.50,0.42,0.25),\n \"risky_pelvis_shift_direction_change\": (\"direction_change\",\"right\",0.55,0.55,0.55,0.25),\n \"risky_stiff_jump_landing\": (\"jump_landing\",\"right\",0.85,0.85,0.35,0.20),\n \"risky_asymmetric_landing\": (\"direction_change\",\"left\",0.55,0.55,0.65,0.35),\n \"ankle_roll_caution\": (\"lunge\",\"right\",0.40,0.40,0.30,0.15),\n \"ankle_roll_critical\": (\"lunge\",\"right\",0.45,0.45,0.35,0.20),\n \"catastrophic_knee_collapse_right_lunge\": (\"lunge\",\"right\",0.90,0.90,0.95,0.55),\n \"catastrophic_crossed_feet_landing\": (\"jump_landing\",\"right\",0.95,0.95,0.90,0.50),\n \"catastrophic_extreme_overreach_lunge\": (\"lunge\",\"right\",0.90,0.90,0.88,0.55),\n \"catastrophic_ankle_roll_proxy_right\": (\"direction_change\",\"right\",0.88,0.88,0.92,0.50),\n \"catastrophic_one_leg_drop_asymmetry\": (\"jump_landing\",\"left\",0.90,0.90,0.96,0.60),\n}\nfor n, p in list(GOOD.items()) + list(RISKY.items()) + list(ROLL.items()) + list(CAT.items()):\n    preset(n, {\"pose\": p, \"ctx\": CTX[n]})\n\n# baseline roll from neutral\nbase_roll = {s: roll_angle(neutral[f\"{s}_knee\"], neutral[f\"{s}_ankle\"], neutral[f\"{s}_heel\"], neutral[f\"{s}_foot_index\"]) or 0 for s in (\"left\",\"right\")}\n\ndef leg_len(p, s): return norm(sub(p[f\"{s}_knee\"], p[f\"{s}_hip\"])) + norm(sub(p[f\"{s}_ankle\"], p[f\"{s}_knee\"]))\ndef foot_center(p, s): return ((p[f\"{s}_heel\"][0]+p[f\"{s}_foot_index\"][0])/2, (p[f\"{s}_heel\"][1]+p[f\"{s}_foot_index\"][1])/2, (p[f\"{s}_heel\"][2]+p[f\"{s}_foot_index\"][2])/2)\ndef knee_angle(p, s): return ang_deg(p[f\"{s}_hip\"], p[f\"{s}_knee\"], p[f\"{s}_ankle\"])\ndef calc(p):\n    et, side, isp, dec, wob, fat = p[\"meta\"]\n    knee = knee_angle(p, side)\n    fc = foot_center(p, side); k = p[f\"{side}_knee\"]; scale = max(leg_len(p, side), 1e-6)\n    knee_dev = abs(k[0]-fc[0])/scale\n    fpa = abs(math.degrees(math.atan2(p[f\"{side}_foot_index\"][0]-p[f\"{side}_heel\"][0], p[f\"{side}_foot_index\"][2]-p[f\"{side}_heel\"][2])))\n    align = 0.70*clamp(knee_dev/0.22,0,1) + 0.30*clamp(fpa/45,0,1)\n    hc = ((p[\"left_hip\"][0]+p[\"right_hip\"][0])/2, (p[\"left_hip\"][1]+p[\"right_hip\"][1])/2, (p[\"left_hip\"][2]+p[\"right_hip\"][2])/2)\n    hip = clamp(math.hypot(hc[0]-fc[0], hc[2]-fc[2])/scale, 0, 1)\n    lk, rk = knee_angle(p,\"left\"), knee_angle(p,\"right\")\n    pw = max(norm(sub(p[\"left_hip\"], p[\"right_hip\"])), 1e-6)\n    avg_leg = (leg_len(p,\"left\")+leg_len(p,\"right\"))/2\n    asym = 0.35*clamp(abs(lk-rk)/60,0,1) + 0.25*clamp(abs(p[\"left_hip\"][1]-p[\"right_hip\"][1])/(pw*0.8),0,1) + 0.20*clamp(abs(p[\"left_ankle\"][1]-p[\"right_ankle\"][1])/(avg_leg*0.20),0,1) + 0.20*wob\n    stiff = clamp((knee-150)/30,0,1)\n    impact = 0.35*isp + 0.40*dec + 0.25*stiff\n    instab = clamp(0.55*wob + 0.25*align + 0.20*hip,0,1)\n    knee_risk = 0 if et==\"no_event\" else clamp((knee-145)/35,0,1)\n    dev = roll_angle(p[f\"{side}_knee\"], p[f\"{side}_ankle\"], p[f\"{side}_heel\"], p[f\"{side}_foot_index\"])\n    rdev = None if dev is None else dev - base_roll[side]\n    roll = 0 if rdev is None or et==\"no_event\" else clamp((abs(rdev)-10)/35,0,1)\n    r_event = rdev is not None and abs(rdev) >= 45 and et != \"no_event\"\n    core = 0.20*knee_risk + 0.20*align + 0.10*roll + 0.15*hip + 0.35*asym\n    final = clamp(core + 0.12*impact + 0.13*instab + 0.10*fat, 0, 1)\n    band = \"GREEN(<35)\" if (r_event or final >= 0.65) else \"YELLOW\" if final >= 0.35 else \"green\"\n    if r_event: band = \"RED(event)\"\n    elif final >= 0.65: band = \"RED\"\n    elif final >= 0.35: band = \"yellow\"\n    else: band = \"green\"\n    return final, band, knee_risk, align, roll, rdev, hip, asym, impact, instab\n\nprint(f\"{'preset':<42} {'final':>5} {'band':<11} {'knee':>5} {'algn':>5} {'roll':>5} {'rdev':>6} {'hip':>5} {'asym':>5} {'imp':>5} {'inst':>5}\")\nfor group in (\"neutral\",\"GOOD\",\"RISKY\",\"ROLL\",\"CAT\"):\n    if group == \"neutral\":\n        p = dict(neutral); p[\"meta\"] = (\"no_event\",\"right\",0.20,0.20,0.05,0.0)\n        f, b, *rest = calc(p)\n        print(f\"{'neutral (no_event)':<42} {f*100:5.0f} {b:<11}\")\n        continue\n    names = {\"GOOD\":GOOD, \"RISKY\":RISKY, \"ROLL\":ROLL, \"CAT\":CAT}[group]\n    for n, pose in names.items():\n        p = dict(neutral); p.update(pose); p[\"meta\"] = CTX[n]\n        f, b, kr, al, rr, rd, hp, asy, im, inst = calc(p)\n        print(f\"{n:<42} {f*100:5.0f} {b:<11} {kr:5.2f} {al:5.2f} {rr:5.2f} {('' if rd is None else f'{rd:+.0f}'):>6} {hp:5.2f} {asy:5.2f} {im:5.2f} {inst:5.2f}\")\nEOF"]
