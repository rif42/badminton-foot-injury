allow = ["Bash=cd /e/work/badminton-foot-injury && python -c \"\nimport csv, os\nimport cv2\nfor name in ('0816(1)', '0816'):\n    cap = cv2.VideoCapture(name + '.mp4')\n    fps = cap.get(cv2.CAP_PROP_FPS)\n    w = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); h = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))\n    n = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n    cap.release()\n    print(f'{name}.mp4: {w}x{h}, {fps:.1f} fps, {n} frames ({n/fps:.1f}s realtime)')\n    p = os.path.join('data/results', name + '_risk_report.csv')\n    rows = list(csv.DictReader(open(p, newline='')))\n    prev = None; toggles = 0\n    for r in rows:\n        s = r['status']\n        if prev is not None and s != prev: toggles += 1\n        prev = s\n    print(f'  status transitions: {toggles} in {len(rows)} rows')\n    import statistics\n    core = [float(r['core_risk']) for r in rows]\n    print(f'  core_risk: mean={statistics.mean(core):.3f} stdev={statistics.pstdev(core):.3f} min={min(core):.2f} max={max(core):.2f}')\n    roll = [float(r['ankle_roll_risk']) for r in rows if r['ankle_roll_risk']]\n    if roll:\n        print(f'  ankle_roll_risk: stdev={statistics.pstdev(roll):.3f} max={max(roll):.2f}')\n\"", "Bash=python - << 'EOF'\nimport math\n\ndef clamp(v, lo, hi): return max(lo, min(hi, v))\ndef rad2deg(r): return r * 180 / math.pi\n\ndef sub(a, b): return (b[0]-a[0], b[1]-a[1], b[2]-a[2])\ndef dot(a, b): return sum(x*y for x, y in zip(a, b))\ndef norm(a): return math.sqrt(dot(a, a))\ndef ang_deg(a, b, c):\n    ba, bc = sub(b, a), sub(b, c)\n    d = norm(ba) * norm(bc)\n    if d < 1e-8: return 0.0\n    cos = clamp(dot(ba, bc) / d, -1, 1)\n    return rad2deg(math.acos(cos))\n\ndef roll_angle(knee, ankle, heel, toe):\n    shank = sub(ankle, knee); ha = sub(ankle, heel); ta = sub(ankle, toe)\n    n = (ha[1]*ta[2]-ha[2]*ta[1], ha[2]*ta[0]-ha[0]*ta[2], ha[0]*ta[1]-ha[1]*ta[0])\n    sl, hl, tl, nl = norm(shank), norm(ha), norm(ta), norm(n)\n    if sl < 1e-9 or nl < 1e-9: return None\n    if nl / max(hl*tl, 1e-12) < 0.15: return None\n    return 90 - rad2deg(math.acos(clamp(dot(n, shank) / (nl*sl), -1, 1)))\n\npresets = {}\ndef P(name, **kw): presets[name] = kw\n\n# default neutral\nP(\"neutral\", left_hip=(-0.22,1.35,0.00), right_hip=(0.22,1.35,0.00), left_knee=(-0.22,0.76,0.02), right_knee=(0.22,0.76,0.02),\n  left_ankle=(-0.22,0.10,0.00), right_ankle=(0.22,0.10,0.00), left_heel=(-0.24,0.03,-0.12), right_heel=(0.20,0.03,-0.12),\n  left_foot_index=(-0.24,0.03,0.22), right_foot_index=(0.20,0.03,0.22))\nneutral = presets[\"neutral\"]\n\ndef preset(name, meta):\n    p = dict(neutral); p.update(meta[\"pose\"]); p[\"meta\"] = meta[\"ctx\"]; presets[name] = p\n\nGOOD = {\n \"good_split_step_soft\": dict(left_hip=(-0.25,1.28,0.00), right_hip=(0.25,1.28,0.00), left_knee=(-0.31,0.70,0.08), right_knee=(0.31,0.70,0.08), left_ankle=(-0.36,0.10,0.12), right_ankle=(0.36,0.10,0.12), left_heel=(-0.39,0.03,-0.03), right_heel=(0.33,0.03,-0.03), left_foot_index=(-0.35,0.03,0.32), right_foot_index=(0.37,0.03,0.32)),\n \"good_right_lunge\": dict(left_hip=(-0.20,1.22,-0.18), right_hip=(0.24,1.18,0.02), left_knee=(-0.25,0.72,-0.10), right_knee=(0.25,0.52,0.48), left_ankle=(-0.27,0.10,-0.18), right_ankle=(0.25,0.10,0.90), left_heel=(-0.30,0.03,-0.30), right_heel=(0.23,0.03,0.76), left_foot_index=(-0.28,0.03,0.08), right_foot_index=(0.28,0.03,1.16)),\n \"good_left_lunge\": dict(left_hip=(-0.24,1.18,0.02), right_hip=(0.20,1.22,-0.18), left_knee=(-0.25,0.52,0.48), right_knee=(0.25,0.72,-0.10), left_ankle=(-0.25,0.10,0.90), right_ankle=(0.27,0.10,-0.18), left_heel=(-0.23,0.03,0.76), right_heel=(0.30,0.03,-0.30), left_foot_index=(-0.28,0.03,1.16), right_foot_index=(0.28,0.03,0.08)),\n \"good_jump_landing_soft\": dict(left_hip=(-0.25,1.16,0.00), right_hip=(0.25,1.16,0.00), left_knee=(-0.30,0.58,0.10), right_knee=(0.30,0.58,0.10), left_ankle=(-0.32,0.10,0.08), right_ankle=(0.32,0.10,0.08), left_heel=(-0.35,0.03,-0.08), right_heel=(0.29,0.03,-0.08), left_foot_index=(-0.32,0.03,0.28), right_foot