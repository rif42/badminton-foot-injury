[permissions]
allow = ["Bash=cd /e/work/badminton-foot-injury && python -c \"\nimport csv, os\nimport cv2\nfor name in ('0816(1)', '0816'):\n    cap = cv2.VideoCapture(name + '.mp4')\n    fps = cap.get(cv2.CAP_PROP_FPS)\n    w = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); h = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))\n    n = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n    cap.release()\n    print(f'{name}.mp4: {w}x{h}, {fps:.1f} fps, {n} frames ({n/fps:.1f}s realtime)')\n    p = os.path.join('data/results', name + '_risk_report.csv')\n    rows = list(csv.DictReader(open(p, newline='')))\n    prev = None; toggles = 0\n    for r in rows:\n        s = r['status']\n        if prev is not None and s != prev: toggles += 1\n        prev = s\n    print(f'  status transitions: {toggles} in {len(rows)} rows')\n    import statistics\n    core = [float(r['core_risk']) for r in rows]\n    print(f'  core_risk: mean={statistics.mean(core):.3f} stdev={statistics.pstdev(core):.3f} min={min(core):.2f} max={max(core):.2f}')\n    roll = [float(r['ankle_roll_risk']) for r in rows if r['ankle_roll_risk']]\n    if roll:\n        print(f'  ankle_roll_risk: stdev={statistics.pstdev(roll):.3f} max={max(roll):.2f}')\n\""]
